[package]
name = "emaki"
version = "0.1.4"
edition = "2021"
description = "絵巻 — Ultra-lightweight, zero-overhead WhatsApp daemon for instant Instagram Reel streaming"
authors = ["Praveensenpai"]
license = "MIT"

[[bin]]
name = "emaki"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
fast_qr = "0.14"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whatsapp-rust = { version = "0.7.0", default-features = false, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal"
] }
